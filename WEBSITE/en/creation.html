<main id="creation" class="section" style="padding-top:10rem"><div class="container"><p class="eyebrow">Work</p><h1>Loading…</h1></div></main><script>
const s=new URLSearchParams(location.search).get('slug');const e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));fetch('/api/index.php?action=public-content').then(r=>r.json()).then(d=>{const x=d.creations.find(c=>c.slug===s);if(!x)throw 0;const f=n=>x[n+'En']||x[n+'Fr']||'';document.title=f('title')+' — Collectif Hydres';document.querySelector('#creation .container').innerHTML=`<p class="eyebrow">${e(f('meta'))}</p><h1>${e(f('title'))}</h1><div class="grid grid-2 mt-lg"><div><p class="lede">${e(f('intro'))}</p><p>${e(f('body'))}</p></div><img class="ph" src="${e(x.hero)}" alt="${e(f('title'))}"></div><div class="strip mt-lg">${x.photos.map(u=>`<img class="ph" src="${e(u)}" alt="${e(f('title'))}">`).join('')}</div>`}).catch(()=>document.querySelector('#creation .container').innerHTML='<h1>Work not found</h1><p><a href="creations.html">Back to works</a></p>');
</script></body></html>
