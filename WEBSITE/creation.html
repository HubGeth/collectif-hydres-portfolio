<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Création — Collectif Hydres</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<header class="site-header is-solid"><a href="index.html" class="logo"><img src="assets/img/logo/mark-white.png" alt=""><span>Hydres</span></a><nav class="nav"><div class="nav-links"><a href="index.html">Accueil</a><a href="collectif.html">Le collectif</a><a href="creations.html">Créations</a><a href="mediation.html">Médiation</a><a href="agenda.html">Agenda</a><a href="contact.html">Contact</a></div></nav></header>
<main id="creation" class="section" style="padding-top:10rem"><div class="container"><p class="eyebrow">Création</p><h1>Chargement…</h1></div></main><script>
const s=new URLSearchParams(location.search).get('slug');const e=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));fetch('/api/index.php?action=public-content').then(r=>r.json()).then(d=>{const x=d.creations.find(c=>c.slug===s);if(!x)throw 0;document.title=x.titleFr+' — Collectif Hydres';document.querySelector('#creation .container').innerHTML=`<p class="eyebrow">${e(x.metaFr)}</p><h1>${e(x.titleFr)}</h1><div class="grid grid-2 mt-lg"><div><p class="lede">${e(x.introFr)}</p><p>${e(x.bodyFr)}</p></div><img class="ph" src="${e(x.hero)}" alt="${e(x.titleFr)}"></div><div class="strip mt-lg">${x.photos.map(u=>`<img class="ph" src="${e(u)}" alt="${e(x.titleFr)}">`).join('')}</div>`}).catch(()=>document.querySelector('#creation .container').innerHTML='<h1>Création introuvable</h1><p><a href="creations.html">Retour aux créations</a></p>');
</script></body></html>
